services:
  # ---- Circulation domain (HU-06) ----
  circulation-db:
    image: postgres:16-alpine
    container_name: circulation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      POSTGRES_DB: circulation_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms_user} -d circulation_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - circulation-db-data:/var/lib/postgresql/data
    networks:
      - lms-network

  circulation-migrate:
    image: migrate/migrate:v4.17.1
    container_name: circulation-migrate
    volumes:
      - ./circulation-service/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD:-lms_password}@circulation-db:5432/circulation_db?sslmode=disable"
      - "up"
    depends_on:
      circulation-db:
        condition: service_healthy
    networks:
      - lms-network

  circulation-service:
    build:
      context: ./circulation-service
      dockerfile: Dockerfile
    container_name: circulation-service
    environment:
      DB_HOST: circulation-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-lms_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      DB_NAME: circulation_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRY: ${JWT_EXPIRY:-1h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      MEMBERSHIP_SERVICE_URL: http://membership-service:8080
      CATALOG_SERVICE_URL: http://catalog-service:8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      circulation-db:
        condition: service_healthy
      circulation-migrate:
        condition: service_completed_successfully
    networks:
      - lms-network

  # ---- Edge ----
  nginx:
    image: nginx:alpine
    container_name: api-gateway
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - circulation-service
    networks:
      - lms-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: lms-frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx
    networks:
      - lms-network

volumes:
  circulation-db-data:

networks:
  lms-network:
    driver: bridge
