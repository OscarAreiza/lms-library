services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-lms_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      DB_NAME: ${POSTGRES_DB:-lms_db}
    depends_on:
      - db
    networks:
      - lms-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - lms-network

  db:
    image: postgres:16-alpine
    container_name: lms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
    volumes:
      - lms-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - lms-network

volumes:
  lms-db-data:

networks:
  lms-network:
    driver: bridge
