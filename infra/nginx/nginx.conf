# API Gateway — routes each path prefix to its owning microservice
# (library-docs/09-microservices/service-catalog.md). Does NOT perform
# authentication/authorization — that stays inside each service
# (ADR-003-nginx-reverse-proxy.md).
#
# No trailing slash on `location` and no URI part on `proxy_pass` — this
# forwards the original request URI to the upstream byte-for-byte, so it
# matches each service's own chi routes regardless of what sub-path follows.
#
# Each domain's feature branch adds its own `location` block here as it's
# implemented — this file only has Circulation (HU-08) so far.
server {
    listen 8080;
    server_name _;

    location /api/v1/loans {
        proxy_pass http://circulation-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://circulation-service:8080;
    }
}
