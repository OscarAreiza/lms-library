# API Gateway — routes each path prefix to its owning microservice
# (library-docs/09-microservices/service-catalog.md). Does NOT perform
# authentication/authorization — that stays inside each service
# (ADR-003-nginx-reverse-proxy.md: NGINX only routes, TLS-terminates, and
# rate-limits; JWT validation is each service's own concern).
#
# Each domain's feature branch adds its own `location` block here as it's
# implemented — this file only has Access (HU-01) so far.
server {
    listen 8080;
    server_name _;

    location /api/v1/auth/ {
        proxy_pass http://access-service:8080/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://access-service:8080/health;
    }
}
