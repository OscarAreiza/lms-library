server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (BrowserRouter) is client-side — any path that isn't a real
    # static file falls back to index.html, and the SPA's own router decides
    # what to render (e.g. a direct visit to /login or /dashboard).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
